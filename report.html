<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060606">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiIgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIj4KICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAGICAKICAKICAKICAKICAKICAKICAKAGAGAGAGAGAGAGAGAGAGAGAGAGAGAGAGAG">
  <title>STROKE TEST &mdash; Report</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,700;1,300&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="report.css">
</head>
<body>

<div class="amb"><div class="ag"></div><div class="ag"></div></div>

<div class="pg">

  <nav class="nav">
    <div class="logo"><b>STROKE</b><span>TEST</span></div>
    <div class="acts">
      <a class="btn btn-g"  href="index.html">&larr; retry</a>
      <button class="btn btn-gh" onclick="dl()">&darr; save report</button>
    </div>
  </nav>

  <div class="hero">
    <div class="hcard">
      <span class="hc-eye">words per minute</span>
      <div class="hc-main">
        <span class="hc-num" id="h-wpm">0</span>
        <span class="hc-unit">wpm</span>
        <div class="hc-ring">
          <canvas id="ring-wpm"></canvas>
          <div class="hc-ring-lbl" id="rl-wpm">&mdash;</div>
        </div>
      </div>
      <span class="hc-sub" id="h-wpm-sub">&mdash;</span>
      <div class="hc-stats">
        <div class="hc-stat-row"><span class="hc-stat-k">raw</span><span class="hc-stat-v" id="h-raw">&mdash;</span></div>
        <div class="hc-stat-row"><span class="hc-stat-k">time</span><span class="hc-stat-v" id="h-time">&mdash;</span></div>
      </div>
      <div class="hc-bar" id="bar-wpm"></div>
    </div>

    <div class="hcard">
      <span class="hc-eye">accuracy</span>
      <div class="hc-main">
        <span class="hc-num" id="h-acc">0%</span>
        <span class="hc-unit">correct</span>
        <div class="hc-ring">
          <canvas id="ring-acc"></canvas>
          <div class="hc-ring-lbl" id="rl-acc">&mdash;</div>
        </div>
      </div>
      <span class="hc-sub" id="h-acc-sub">&mdash;</span>
      <div class="hc-stats">
        <div class="hc-stat-row"><span class="hc-stat-k">words</span><span class="hc-stat-v" id="h-words">&mdash;</span></div>
        <div class="hc-stat-row"><span class="hc-stat-k">errors</span><span class="hc-stat-v" id="h-err">&mdash;</span></div>
      </div>
      <div class="hc-bar" id="bar-acc"></div>
    </div>
  </div>

  <div class="chart-panel">
    <div class="cpi">
      <div class="cp-hdr">
        <span class="cp-ttl">wpm &amp; accuracy over time</span>
        <div class="cp-leg">
          <div class="cl"><div class="cl-dash"></div>raw</div>
          <div class="cl"><div class="cl-line" style="background:var(--g)"></div>wpm</div>
          <div class="cl"><div class="cl-dot"></div>acc %</div>
          <div class="cl"><span class="cl-x">&times;</span>errors</div>
        </div>
      </div>
      <div class="lw"><canvas id="lineC"></canvas></div>
    </div>
  </div>

  <div class="bot-row">
    <div class="donut-panel">
      <span class="dp-ttl">keystroke split</span>
      <div class="dw">
        <canvas id="donutC" width="130" height="130"></canvas>
        <div class="dc">
          <span class="dc-big" id="d-pct">&mdash;</span>
          <span class="dc-sub">correct</span>
        </div>
      </div>
      <div class="dl">
        <div class="dl-row">
          <div class="dl-dot" style="background:var(--g)"></div>
          <span class="dl-nm">correct</span>
          <span class="dl-vl" id="d-correct">&mdash;</span>
        </div>
        <div class="dl-row">
          <div class="dl-dot" style="background:var(--err)"></div>
          <span class="dl-nm">errors</span>
          <span class="dl-vl" id="d-errors">&mdash;</span>
        </div>
      </div>
    </div>

    <div class="bar-panel">
      <div class="bpi">
        <div class="cp-hdr" style="margin-bottom:10px;">
          <span class="cp-ttl">performance breakdown</span>
        </div>
        <div class="bw"><canvas id="barC"></canvas></div>
      </div>
    </div>
  </div>

  <div class="tier">
    <span class="tier-ey">// performance tier</span>
    <div class="tier-nm" id="t-nm">&mdash;</div>
    <div class="tier-qt" id="t-qt">&mdash;</div>
  </div>

  <div class="ft">
    <div class="ft-l">STROKE<b>TEST</b></div>
    <span class="ft-r" id="ft-date">&mdash;</span>
  </div>

</div>

<script src="report.js"></script>
</body>
</html>

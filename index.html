<style>
  :root {
    --bg: #0a0a0a;
    --surface: #0f0f0f;
    --border: #1e1e1e;
    --text: #e8e8e8;
    --muted: #3a3a3a;
    --muted2: #666;
    --accent: #f5c542;
    --accent2: #ffd966;
    --correct: #f5c542;
    --wrong: #f97316;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }

  /* Grid background */
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(245,197,66,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,197,66,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridDrift 20s linear infinite;
    pointer-events: none; z-index: 0;
  }
  @keyframes gridDrift { from { background-position: 0 0; } to { background-position: 48px 48px; } }
  body::after {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 600px 300px at 0% 0%, rgba(245,197,66,0.05) 0%, transparent 70%),
      radial-gradient(ellipse 600px 300px at 100% 100%, rgba(245,197,66,0.04) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }


  .wrapper {
    width: 100%; max-width: 1300px;
    padding: 0 28px 10px;
    margin-top: 10px;
    display: flex; flex-direction: column; gap: 6px;
    position: relative; z-index: 1;
    height: calc(100vh - 20px);
    animation: pageIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  
  header {
    flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }


  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.8rem;
    letter-spacing: 8px;
    line-height: 1;
    position: relative;
    cursor: default;
  }
  .logo-stroke {
    color: var(--accent);
    display: inline-block;
    position: relative;
    animation: logoStrokeGlitch 7s steps(1) infinite;
  }
  /* RGB aberration layers */
  .logo-stroke::before,
  .logo-stroke::after {
    content: 'STROKE';
    font-family: 'Bebas Neue', sans-serif;
    font-size: inherit;
    letter-spacing: inherit;
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    opacity: 0;
  }
  .logo-stroke::before { color: #ff3030; }
  .logo-stroke::after  { color: #00cfff; }

  @keyframes logoStrokeGlitch {
    /* ── long idle ── */
    0%, 70%, 100% {
      transform: none; opacity: 1; color: var(--accent);
      text-shadow: none; clip-path: none; filter: none;
    }
    /* ── burst 1: full split ── */
    71%   { transform: translateX(-4px); color: #fff8d6;
            text-shadow: 4px 0 0 rgba(255,48,48,0.7), -4px 0 0 rgba(0,207,255,0.7);
            filter: brightness(1.4); }
    71.4% { transform: translateX(5px); color: var(--accent);
            text-shadow: -3px 0 0 rgba(255,48,48,0.5), 3px 0 0 rgba(0,207,255,0.5); }
    71.8% { transform: none; opacity: 0.3; text-shadow: none; }
    72.2% { transform: translateX(-2px); opacity: 1; color: #fff;
            text-shadow: 2px 0 0 rgba(255,48,48,0.6), -2px 0 0 rgba(0,207,255,0.6);
            filter: brightness(1.8); }
    72.6% { transform: none; color: var(--accent); text-shadow: none; filter: none; }
    /* ── micro-flicker ── */
    73%   { opacity: 0.15; }
    73.3% { opacity: 1; }
    /* ── aberration layers on burst 1 ── */
    /* ── burst 2: clip-slice ── */
    84%   { clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
            transform: translateX(-6px); color: #fff8d6; filter: brightness(1.5); }
    84.3% { clip-path: polygon(0 40%, 100% 40%, 100% 100%, 0 100%);
            transform: translateX(6px); color: var(--accent2); }
    84.6% { clip-path: none; transform: none; opacity: 0.5; color: var(--accent); }
    85%   { opacity: 1;
            text-shadow: 3px 0 0 rgba(255,48,48,0.5), -3px 0 0 rgba(0,207,255,0.5); }
    85.4% { text-shadow: none; transform: translateX(2px); }
    85.8% { transform: none; opacity: 1; color: var(--accent); }
    /* ── double micro-flicker after burst 2 ── */
    86.2% { opacity: 0.2; }
    86.5% { opacity: 1; }
    86.8% { opacity: 0.5; }
    87%   { opacity: 1; color: var(--accent); text-shadow: none; }
  }

  /* Red layer animation synced to main */
  @keyframes logoStrokeRed {
    0%, 70%, 74%, 83%, 88%, 100% { opacity: 0; transform: none; }
    71%   { opacity: 0.85; transform: translateX(-6px); }
    71.4% { opacity: 0.6; transform: translateX(7px); }
    71.8% { opacity: 0; }
    72.2% { opacity: 0.7; transform: translateX(-4px); }
    72.6% { opacity: 0; }
    84%   { opacity: 0.8; transform: translateX(-8px); }
    84.3% { opacity: 0.5; transform: translateX(5px); }
    84.6% { opacity: 0; }
    85%   { opacity: 0.6; transform: translateX(-4px); }
    85.4% { opacity: 0; }
  }
  /* Cyan layer animation synced to main */
  @keyframes logoStrokeCyan {
    0%, 70%, 74%, 83%, 88%, 100% { opacity: 0; transform: none; }
    71%   { opacity: 0.7; transform: translateX(6px); }
    71.4% { opacity: 0.85; transform: translateX(-7px); }
    71.8% { opacity: 0; }
    72.2% { opacity: 0.75; transform: translateX(4px); }
    72.6% { opacity: 0; }
    84%   { opacity: 0.6; transform: translateX(8px); }
    84.3% { opacity: 0.8; transform: translateX(-5px); }
    84.6% { opacity: 0; }
    85%   { opacity: 0.5; transform: translateX(4px); }
    85.4% { opacity: 0; }
  }
  .logo-stroke::before { animation: logoStrokeRed  7s steps(1) infinite; }
  .logo-stroke::after  { animation: logoStrokeCyan 7s steps(1) infinite; }

  .logo-letter {
    display: inline-block;
    color: var(--accent);
  }
  .logo-test {
    display: inline-block;
    position: relative;
    animation: logoTestGlitch 7s steps(1) infinite;
  }
  @keyframes logoTestGlitch {
    0%, 70%, 74%, 83%, 88%, 100% {
      transform: none; opacity: 1; color: #3a3a3a; text-shadow: none;
    }
    71%   { transform: translateX(-3px); color: #555; }
    71.4% { transform: translateX(4px); color: #3a3a3a; }
    71.8% { opacity: 0.2; }
    72.2% { opacity: 1; transform: translateX(-2px); color: #4a4a4a; }
    72.6% { transform: none; color: #3a3a3a; }
    73%   { opacity: 0.1; }
    73.3% { opacity: 1; }
    84%   { transform: translateX(4px); color: #555; opacity: 0.8; }
    84.3% { transform: translateX(-4px); opacity: 1; color: #3a3a3a; }
    84.6% { transform: none; opacity: 0.4; }
    85%   { opacity: 1; }
    86.2% { opacity: 0.15; }
    86.5% { opacity: 1; color: #3a3a3a; }
  }
  .logo-test-letter {
    display: inline-block;
    color: #3a3a3a;
  }
  /* underline draw on hover */
  .logo::after {
    content: ''; position: absolute; bottom: -2px; left: 0;
    width: 100%; height: 2px; background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
  }
  .logo:hover::after { transform: scaleX(1); }

  .header-right { display: flex; align-items: center; gap: 16px; }
  .tagline { font-size: 0.7rem; font-weight: 600; color: var(--muted2); letter-spacing: 3px; text-transform: uppercase; }
  .hint-tag { font-size: 0.68rem; font-weight: 700; color: var(--muted2); letter-spacing: 1px; border: 1px solid var(--border); padding: 3px 10px; }

  
  .card {
    flex: 1; min-height: 0;
    background: transparent; border: 1px solid transparent;
    overflow: hidden; display: flex; flex-direction: column;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
    animation: cardIn 0.6s 0.1s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes cardIn {
    from { opacity:0; transform: translateY(12px) scale(0.99); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }
  .card.focused {
    border-color: transparent;
    box-shadow: none;
  }

  
  .stats-panel {
    flex-shrink: 0;
    display: grid; gap: 1px;
    background: transparent; border-bottom: 1px solid var(--border);
  }
  .stats-panel.during-test  { grid-template-columns: 1fr 2.5fr; }
  .stats-panel.show-results { grid-template-columns: repeat(4,1fr); }

  .stat {
    background: transparent; padding: 10px 20px;
    text-align: center; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .stat::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(245,197,66,0.03) 0%, transparent 60%);
    opacity: 0; transition: opacity 0.3s;
  }
  .stat:hover::before { opacity: 1; }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem; color: var(--accent); line-height: 1; display: inline-block;
  }
  .stat-value.big { font-size: 4rem; animation: numCount 0.5s ease; }
  @keyframes numCount {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .stat-label {
    font-size: 0.82rem; font-weight: 700; color: var(--muted2);
    letter-spacing: 2.5px; text-transform: uppercase; margin-top: 2px; display: block;
  }

  .stat-quote {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.35rem;
    font-style: italic;
    font-weight: 600;
    line-height: 1.5;
    padding: 0 20px;
    text-align: center;
    transition: opacity 0.4s ease, transform 0.4s ease;
    letter-spacing: 0.2px;
  }
  .stat-quote.fade { opacity: 0; transform: translateY(6px); -webkit-text-fill-color: transparent; }

  @keyframes statReveal {
    from { opacity:0; transform: translateY(10px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .stat.animate-in { opacity:0; animation: statReveal 0.45s ease forwards; }
  .stat.animate-in:nth-child(1) { animation-delay: 0.04s; }
  .stat.animate-in:nth-child(2) { animation-delay: 0.12s; }
  .stat.animate-in:nth-child(3) { animation-delay: 0.20s; }
  .stat.animate-in:nth-child(4) { animation-delay: 0.28s; }

  
  .options-row {
    flex-shrink: 0;
    display: flex; align-items: center;
    padding: 8px 28px; border-bottom: 1px solid var(--border);
  }
  .opt-label { font-size: 0.78rem; font-weight: 700; color: var(--muted2); letter-spacing: 2px; text-transform: uppercase; margin-right: 20px; white-space: nowrap; }

  /* ── Pill track selector ── */
  .duration-track {
    position: relative;
    display: flex;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    padding: 3px;
    gap: 0;
  }
  /* Sliding gold pill */
  .duration-pill {
    position: absolute;
    top: 3px; bottom: 3px;
    background: var(--accent);
    transition: left 0.32s cubic-bezier(0.34,1.56,0.64,1), width 0.32s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
    z-index: 0;
  }
  .duration-option {
    position: relative; z-index: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem; font-weight: 700; letter-spacing: 1px;
    color: var(--muted2);
    background: transparent; border: none;
    padding: 6px 26px;
    cursor: pointer;
    transition: color 0.2s ease;
    white-space: nowrap;
  }
  .duration-option.active { color: #000; }
  .duration-option:not(.active):hover { color: var(--accent); }

  @keyframes optIn {
    from { opacity: 0; transform: translateY(8px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes optShimmer {
    0%   { left: -80%; }
    100% { left: 130%; }
  }
  /* unused but kept to not break anything referencing these names */
  @keyframes optActivePop { 0%,100% { transform:scale(1); } }
  @keyframes optGlowPulse { 0%,100% { box-shadow:none; } }

  .timer-bar-wrap {
    flex-shrink: 0;
    height: 7px;            /* wider / taller */
    background: rgba(255,255,255,0.03);
    position: relative; overflow: hidden;
  }
  .timer-bar {
    height: 100%; width: 100%; transform-origin: left; position: relative;
    background: linear-gradient(90deg, transparent 0%, var(--accent) 20%, var(--accent2) 50%, var(--accent) 80%, transparent 100%);
    background-size: 300% 100%;
  }
  .timer-bar.running { animation: barShimmer 1.8s linear infinite; }
  @keyframes barShimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
  .timer-bar-wrap::after {
    content: ''; position: absolute; inset: 0;
    background: var(--accent); opacity: 0; filter: blur(8px); pointer-events: none;
  }
  .timer-bar-wrap.running::after { animation: barGlow 2s ease-in-out infinite; }
  @keyframes barGlow {
    0%, 100% { opacity: 0.1; }
    50%       { opacity: 0.3; }
  }


  .words-area {
    flex: 1; min-height: 0;
    padding: 24px 12px;
    position: relative; overflow: hidden;
  }
  .words-area.typing-glow { animation: edgeGlow 2s ease-in-out infinite; }


  .click-prompt {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.42);   /* words visible through */
    z-index: 20; opacity: 1;
    transition: opacity 0.35s ease;
  }
  .click-prompt.hidden { opacity: 0; pointer-events: none; }

  .click-prompt-inner {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }

  /* Animated "Hit a key to start" box */
  .click-prompt-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 7px;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    padding: 14px 44px;
    position: relative; overflow: hidden;
    animation: promptGlow 1.6s ease-in-out infinite;
    text-transform: uppercase;
  }
  .click-prompt-text::before {
    content: '';
    position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(245,197,66,0.18), transparent);
    animation: promptSweep 1.8s ease-in-out infinite;
  }
  @keyframes promptSweep {
    0%   { left: -60%; }
    100% { left: 130%; }
  }
  @keyframes promptGlow {
    0%, 100% {
      box-shadow: 0 0 10px rgba(245,197,66,0.25), inset 0 0 10px rgba(245,197,66,0.06);
      border-color: rgba(245,197,66,0.55); color: rgba(245,197,66,0.8);
    }
    50% {
      box-shadow: 0 0 30px rgba(245,197,66,0.6), inset 0 0 18px rgba(245,197,66,0.12);
      border-color: var(--accent); color: var(--accent);
    }
  }

 
  @keyframes quoteEntrance {
    0%   { opacity: 0; transform: translateY(14px) scale(0.95); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0)    scale(1);    filter: blur(0); }
  }
  @keyframes challengeShimmer {
    0%   { background-position: -300% center; }
    100% { background-position: 300% center; }
  }
  @keyframes challengeFloat {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-5px); }
  }

  .challenge-quote {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.3rem;
    font-style: italic;
    font-weight: 600;
    text-align: center;
    max-width: 600px;
    line-height: 1.55;
    background: linear-gradient(90deg, rgba(245,197,66,0.5) 0%, #fff8d6 40%, var(--accent) 60%, rgba(245,197,66,0.5) 100%);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: quoteEntrance 0.6s cubic-bezier(0.22,1,0.36,1) both,
               challengeShimmer 4s linear infinite,
               challengeFloat 4s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(245,197,66,0.25));
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .challenge-quote.fade-out { opacity: 0; transform: translateY(8px); -webkit-text-fill-color: transparent; }

  .words-display {
    font-size: 1.78rem; line-height: 1.75;
    font-weight: 600;
    user-select: none; position: relative;
    overflow: hidden; height: 100%;
    color: #3e3e3e; transition: color 0.4s ease;
  }
  .words-display.active-typing { color: #686868; }
  /* Last-line fade-out */
  .words-display::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 22%; pointer-events: none; z-index: 6;
    background: linear-gradient(to bottom, transparent 0%, var(--bg) 100%);
  }

  /* words-inner scrolls via translateY */
  #words-inner {
    position: relative;
    transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
    display: flex; flex-wrap: wrap; align-content: flex-start;
    gap: 0 0.45em;
  }

  .char { display: inline-block; position: relative; transition: color 0.06s; }
  .char.correct { color: var(--correct); }
  .char.wrong {
    color: var(--wrong);
    animation: charShatter 0.35s cubic-bezier(0.36,0.07,0.19,0.97) forwards;
  }
  @keyframes charShatter {
    0%   { transform: scale(1) rotate(0deg);     opacity: 1; }
    20%  { transform: scale(1.5) rotate(-10deg); color: #ff4500; }
    45%  { transform: scale(0.65) rotate(14deg); opacity: 0.8; filter: blur(0.5px); }
    70%  { transform: scale(1.1) rotate(-4deg);  opacity: 0.9; }
    100% { transform: scale(1) rotate(0deg);     opacity: 1; color: var(--wrong); }
  }

  /* NEW: correct char glow ripple */
  @keyframes correctGlow {
    0%   { text-shadow: none; }
    40%  { text-shadow: 0 0 8px rgba(245,197,66,0.9), 0 0 16px rgba(245,197,66,0.5); }
    100% { text-shadow: 0 0 3px rgba(245,197,66,0.25); }
  }
  .char.correct {
    color: var(--correct);
    animation: correctGlow 0.55s ease forwards;
  }



  /* NEW: cursor trail sparkles */
  @keyframes sparkFade {
    0%   { opacity: 0.9; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(0.2) translateY(-14px); }
  }
  .cursor-spark {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: var(--accent); pointer-events: none; z-index: 9;
    animation: sparkFade 0.5s ease forwards;
  }

  /* NEW: scanline sweep on card when active */
  @keyframes scanSweep {
    0%   { top: -4px; opacity: 0.18; }
    50%  { opacity: 0.35; }
    100% { top: 100%; opacity: 0; }
  }
  .card.focused::before {
    content: '';
    position: absolute; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, rgba(245,197,66,0.6), transparent);
    animation: scanSweep 3s ease-in-out infinite;
    pointer-events: none; z-index: 5;
  }
  .card { position: relative; overflow: hidden; }

  /* NEW: button ripple */
  @keyframes btnRipple {
    0%   { transform: scale(0); opacity: 0.5; }
    100% { transform: scale(4); opacity: 0; }
  }
  .btn-ripple {
    position: absolute; border-radius: 50%;
    width: 40px; height: 40px; margin-left: -20px; margin-top: -20px;
    background: rgba(245,197,66,0.4);
    animation: btnRipple 0.6s ease forwards;
    pointer-events: none;
  }

  /* NEW: word commit flash */
  @keyframes wordFlash {
    0%   { background: rgba(245,197,66,0.12); }
    100% { background: transparent; }
  }
  .word.committed { animation: wordFlash 0.4s ease forwards; }

  /* NEW: stat value big bounce on results */
  @keyframes numCount {
    0%   { transform: scale(0.5) translateY(10px); opacity: 0; }
    60%  { transform: scale(1.12) translateY(-3px); opacity: 1; }
    80%  { transform: scale(0.96); }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* NEW: floating +1 particles on correct word */
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-36px) scale(0.7); }
  }
  .float-particle {
    position: absolute; font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem; color: var(--accent); pointer-events: none; z-index: 15;
    animation: floatUp 0.75s ease forwards;
  }

  /* Timer tick animation */
  @keyframes timerTick {
    0%   { transform: scale(1); }
    18%  { transform: scale(1.22); color: #fff8d6; text-shadow: 0 0 18px rgba(245,197,66,1), 0 0 40px rgba(245,197,66,0.5); }
    40%  { transform: scale(0.93); }
    65%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .time-tick {
    display: inline-block;
    animation: timerTick 0.5s cubic-bezier(0.22,1,0.36,1);
  }

  /* Urgency pulse when <= 10s */
  @keyframes urgentPulse {
    0%, 100% { color: var(--accent); text-shadow: 0 0 6px rgba(245,197,66,0.4); }
    50%       { color: #ff6b35; text-shadow: 0 0 22px rgba(255,107,53,0.9), 0 0 40px rgba(255,107,53,0.4); }
  }
  .stat-value.urgent { animation: urgentPulse 0.7s ease-in-out infinite; }

  /* Row entrance animation for words */
  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .word { display: inline-block; white-space: nowrap; animation: rowIn 0.3s ease both; }

  /* Correct word golden shimmer */
  @keyframes wordGoldShimmer {
    0%   { filter: brightness(1); }
    40%  { filter: brightness(1.6) drop-shadow(0 0 4px rgba(245,197,66,0.7)); }
    100% { filter: brightness(1); }
  }
  .word.committed { animation: wordGoldShimmer 0.45s ease forwards; }

  /* Stat panel glow on results reveal */
  @keyframes statPanelGlow {
    0%   { box-shadow: none; }
    40%  { box-shadow: 0 0 30px rgba(245,197,66,0.18), inset 0 0 20px rgba(245,197,66,0.06); }
    100% { box-shadow: 0 0 8px rgba(245,197,66,0.06); }
  }
  .stats-panel.show-results { animation: statPanelGlow 1s ease forwards; }

  /* WPM big number roll-in */
  @keyframes numCount {
    0%   { transform: scale(0.5) translateY(10px); opacity: 0; }
    60%  { transform: scale(1.15) translateY(-3px); opacity: 1; }
    80%  { transform: scale(0.97); }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* Quote text entrance shimmer */
  @keyframes quoteShimmer {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  .stat-quote {
    background: linear-gradient(90deg, var(--accent) 30%, #fff8d6 50%, var(--accent) 70%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: quoteShimmer 3.5s linear infinite;
  }
  .stat-quote.fade { opacity: 0; transform: translateY(6px); -webkit-text-fill-color: transparent; }

  /* Char cascade on test start — only untyped chars */
  @keyframes charDrop {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .words-display.active-typing .char:not(.correct):not(.wrong) {
    animation: charDrop 0.25s ease both;
  }

  /* Edge glow pulse when typing */
  @keyframes edgeGlow {
    0%, 100% { box-shadow: inset 0 0 0px rgba(245,197,66,0); }
    50%       { box-shadow: inset 0 0 22px rgba(245,197,66,0.07); }
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-6px); }
    60%       { transform: translateX(6px); }
  }
  .word.shake { animation: wrongShake 0.28s ease; }

  /* Cursor */
  #cursor-beam {
    position: absolute; width: 2px; border-radius: 1px;
    background: var(--accent); pointer-events: none; z-index: 10; display: none;
    transition: left 0.07s cubic-bezier(0.25,0.46,0.45,0.94), top 0.07s cubic-bezier(0.25,0.46,0.45,0.94), height 0.05s ease;
    box-shadow: 0 0 5px var(--accent), 0 0 12px rgba(245,197,66,0.3);
    animation: beamBlink 1s ease-in-out infinite;
  }
  @keyframes beamBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }

  #hidden-input {
    position: absolute; opacity: 0; pointer-events: none;
    width: 1px; height: 1px; top: 0; left: 0;
  }

  .actions {
    flex-shrink: 0;
    display: flex; gap: 12px; align-items: center;
    animation: actionsIn 0.8s 0.2s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes actionsIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
  .btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; padding: 10px 28px;
    cursor: pointer; border: 1px solid var(--border);
    background: transparent; color: var(--muted2);
    transition: all 0.2s; position: relative; overflow: hidden;
  }
  .btn::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 1px; background: var(--accent);
    transform: scaleX(0); transition: transform 0.2s ease;
  }
  .btn:hover { color: var(--accent); border-color: var(--accent); }
  .btn:hover::after { transform: scaleX(1); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #000; }
  .btn-primary::after { display: none; }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: #000; }
  /* Digit-drop result reveal */
  @keyframes digitFall {
    0%   { opacity: 0; transform: translateY(-28px) scale(1.3); filter: blur(3px); }
    55%  { opacity: 1; transform: translateY(4px)   scale(0.95); filter: blur(0); }
    75%  { transform: translateY(-2px) scale(1.02); }
    100% { opacity: 1; transform: translateY(0)     scale(1);    filter: blur(0); }
  }
  .digit-drop {
    display: inline-block;
    animation: digitFall 0.45s cubic-bezier(0.22,1,0.36,1) both;
  }

  .hint-small { font-size: 0.7rem; font-weight: 600; color: var(--muted2); letter-spacing: 1px; margin-left: 4px; }

  /* ══════════════════════════════════════════════
     RESTART BUTTON — Advanced Terminal Exec Button
  ══════════════════════════════════════════════ */
  #restart-btn {
    font-family: 'Bebas Neue', sans-serif !important;
    font-size: 1rem !important;
    letter-spacing: 5px !important;
    padding: 0 !important;
    background: transparent !important;
    border: none !important;
    color: var(--accent) !important;
    display: flex !important;
    align-items: stretch !important;
    overflow: visible !important;
    position: relative !important;
    cursor: pointer !important;
    outline: none !important;
    height: 40px;
  }

  /* ── Outer shell: the button frame ── */
  #restart-btn .rb-shell {
    display: flex;
    align-items: stretch;
    position: relative;
    border: 1px solid rgba(245,197,66,0.25);
    overflow: hidden;
    transition: border-color 0.3s ease;
    background: #050505;
    animation: rbIdleShellGlitch 6s steps(1) infinite;
  }
  #restart-btn:hover .rb-shell,
  #restart-btn.firing .rb-shell {
    animation: none;
    border-color: rgba(245,197,66,0.7);
  }

  /* Idle shell glitch — border flickers, subtle horizontal slice shifts */
  @keyframes rbIdleShellGlitch {
    0%, 78%, 100% { border-color: rgba(245,197,66,0.25); transform: none; box-shadow: none; }
    /* first burst */
    79%   { border-color: rgba(245,197,66,0.8); box-shadow: -3px 0 0 rgba(245,197,66,0.5), 3px 0 0 rgba(51,204,255,0.3); transform: translateX(-2px); }
    79.5% { border-color: rgba(245,197,66,0.15); transform: translateX(3px); box-shadow: 2px 0 0 rgba(245,197,66,0.4); }
    80%   { border-color: rgba(245,197,66,0.7); transform: none; box-shadow: none; }
    80.5% { border-color: rgba(245,197,66,0.2); transform: translateX(-1px); }
    81%   { border-color: rgba(245,197,66,0.25); transform: none; box-shadow: none; }
    /* second burst, slightly different timing */
    88%   { border-color: rgba(245,197,66,0.6); transform: translateX(2px); box-shadow: -2px 0 0 rgba(255,80,80,0.3), 2px 0 0 rgba(51,204,255,0.25); }
    88.3% { border-color: rgba(245,197,66,0.1); transform: none; }
    88.6% { border-color: rgba(245,197,66,0.55); transform: translateX(-1px); }
    89%   { border-color: rgba(245,197,66,0.25); transform: none; }
  }

  /* Idle icon glitch — the ↺ symbol twitches */
  #restart-btn .rb-icon-inner {
    display: inline-block;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
    font-style: normal;
    animation: rbIdleIconGlitch 6s steps(1) infinite;
  }
  #restart-btn:hover .rb-icon-inner,
  #restart-btn.firing .rb-icon-inner {
    animation: none;
  }
  @keyframes rbIdleIconGlitch {
    0%, 78%, 100% { transform: none; opacity: 1; filter: none; color: var(--accent); }
    79%   { transform: scaleX(-1) translateX(-2px); opacity: 0.7; filter: brightness(2); color: #fff; }
    79.5% { transform: translateX(3px) rotate(5deg); opacity: 1; color: var(--accent2); filter: none; }
    80%   { transform: none; opacity: 0.4; }
    80.5% { transform: none; opacity: 1; color: var(--accent); }
    88%   { transform: translateX(-2px); filter: brightness(1.8); color: #fff8d6; }
    88.3% { transform: translateX(1px) rotate(-3deg); filter: none; color: var(--accent); }
    88.6% { transform: none; opacity: 0.6; }
    89%   { transform: none; opacity: 1; color: var(--accent); }
  }

  /* Idle text glitch — RESTART text slices */
  #restart-btn .rb-text {
    padding: 0 18px;
    display: flex; align-items: center;
    position: relative; overflow: hidden;
    font-size: 0.88rem;
    letter-spacing: 5px;
    color: var(--accent);
    white-space: nowrap;
    transition: color 0.2s;
    animation: rbIdleTextGlitch 6s steps(1) infinite;
  }
  #restart-btn:hover .rb-text,
  #restart-btn.firing .rb-text {
    animation: none;
  }
  @keyframes rbIdleTextGlitch {
    0%, 78%, 100% { transform: none; opacity: 1; filter: none; clip-path: none; color: var(--accent); }
    /* slice top half */
    79%   { clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%); transform: translateX(-4px); filter: brightness(1.6); color: #fff8d6; }
    79.5% { clip-path: polygon(0 45%, 100% 45%, 100% 100%, 0 100%); transform: translateX(4px); filter: brightness(1.3); color: var(--accent); }
    80%   { clip-path: none; transform: none; filter: none; opacity: 0.5; }
    80.5% { opacity: 1; color: var(--accent2); }
    81%   { color: var(--accent); filter: none; clip-path: none; transform: none; }
    /* second glitch burst */
    88%   { clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%); transform: translateX(3px); color: #fff; filter: brightness(1.4); }
    88.3% { clip-path: polygon(0 0, 100% 0, 100% 55%, 0 55%); transform: translateX(-3px); color: var(--accent2); filter: none; }
    88.6% { clip-path: none; transform: none; opacity: 0.7; color: var(--accent); }
    89%   { opacity: 1; transform: none; clip-path: none; }
  }

  /* ── Charge bar: fills from left on hover, drains on click ── */
  #restart-btn .rb-charge {
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    width: 0%;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2));
    transition: width 0s;
    pointer-events: none;
    z-index: 4;
  }
  #restart-btn:hover .rb-charge {
    width: 100%;
    transition: width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #restart-btn.firing .rb-charge {
    width: 0%;
    transition: width 0.15s ease-out;
    background: #fff;
    height: 3px;
    filter: blur(1px);
  }

  /* ── Top accent line ── */
  #restart-btn .rb-shell::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(245,197,66,0.5) 50%, transparent 100%);
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 3;
  }
  #restart-btn:hover .rb-shell::before { opacity: 1; }

  /* ── Icon zone ── */
  #restart-btn .rb-icon {
    width: 40px;
    display: flex; align-items: center; justify-content: center;
    border-right: 1px solid rgba(245,197,66,0.15);
    color: var(--accent);
    font-size: 1.1rem;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
    background: rgba(245,197,66,0.04);
  }
  #restart-btn:hover .rb-icon { border-right-color: rgba(245,197,66,0.35); background: rgba(245,197,66,0.08); }

  /* Icon base rotation on hover */
  #restart-btn:hover .rb-icon-inner {
    transform: rotate(-200deg) scale(1.15);
    animation: none !important;
  }
  /* Text shimmer sweep on hover */
  #restart-btn .rb-text::after {
    content: '';
    position: absolute; top: 0; bottom: 0; width: 30%;
    background: linear-gradient(90deg, transparent, rgba(245,197,66,0.25), transparent);
    left: -40%; opacity: 0;
    transition: opacity 0s;
  }
  #restart-btn:hover .rb-text::after {
    opacity: 1;
    left: 130%;
    transition: left 0.5s ease 0.05s, opacity 0s;
  }

  /* ── Corner brackets grow on hover ── */
  #restart-btn .rb-corner-tl,
  #restart-btn .rb-corner-br {
    position: absolute;
    width: 0px; height: 0px;
    transition: width 0.25s ease, height 0.25s ease, opacity 0.25s ease;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }
  #restart-btn .rb-corner-tl {
    top: -2px; left: -2px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
  }
  #restart-btn .rb-corner-br {
    bottom: -2px; right: -2px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
  }
  #restart-btn:hover .rb-corner-tl,
  #restart-btn:hover .rb-corner-br {
    width: 12px; height: 12px; opacity: 1;
  }

  /* ══ FIRING STATE — plasma ignition sequence ══ */

  /* Shell flash */
  @keyframes rbShellFire {
    0%   { border-color: rgba(245,197,66,0.7); background: #050505; }
    8%   { border-color: #fff; background: rgba(245,197,66,0.18); box-shadow: 0 0 0 2px rgba(245,197,66,0.3), 0 0 30px rgba(245,197,66,0.5), 0 0 60px rgba(245,197,66,0.2); }
    18%  { border-color: var(--accent); background: rgba(245,197,66,0.06); box-shadow: 0 0 20px rgba(245,197,66,0.35); }
    35%  { border-color: var(--accent2); box-shadow: 0 0 10px rgba(245,197,66,0.2); }
    65%  { border-color: rgba(245,197,66,0.4); box-shadow: none; }
    100% { border-color: rgba(245,197,66,0.25); background: #050505; box-shadow: none; }
  }
  #restart-btn.firing .rb-shell {
    animation: rbShellFire 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  /* Icon spin burst */
  @keyframes rbIconBurst {
    0%   { transform: rotate(0deg) scale(1); filter: none; }
    12%  { transform: rotate(-100deg) scale(0.6); filter: brightness(3) blur(1px); color: #fff; }
    30%  { transform: rotate(-300deg) scale(1.3); filter: brightness(2); }
    55%  { transform: rotate(-380deg) scale(0.9); }
    75%  { transform: rotate(-355deg) scale(1.05); }
    100% { transform: rotate(-360deg) scale(1); filter: none; }
  }
  #restart-btn.firing .rb-icon-inner {
    animation: rbIconBurst 0.55s cubic-bezier(0.22,1,0.36,1) forwards !important;
    transition: none !important;
    color: var(--accent);
  }

  /* Text glitch scramble */
  @keyframes rbTextGlitch {
    0%   { transform: none; opacity: 1; filter: none; }
    10%  { transform: translateX(-3px); filter: blur(0.5px); opacity: 0.7; }
    20%  { transform: translateX(4px) skewX(-5deg); opacity: 1; letter-spacing: 2px; }
    30%  { transform: translateX(-2px); letter-spacing: 7px; filter: brightness(1.5); }
    50%  { transform: none; letter-spacing: 5px; opacity: 0.9; }
    70%  { filter: brightness(1.2); }
    100% { transform: none; opacity: 1; filter: none; letter-spacing: 5px; }
  }
  #restart-btn.firing .rb-text {
    animation: rbTextGlitch 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  /* Particle sparks that fly out on click — injected via JS */
  @keyframes rbSpark {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
  }
  .rb-spark {
    position: fixed;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--accent2);
    pointer-events: none;
    z-index: 9999;
    animation: rbSpark 0.6s ease-out forwards;
  }
  .rb-spark.big {
    width: 4px; height: 4px;
    background: #fff;
    box-shadow: 0 0 4px var(--accent);
  }
</style>
</head>
<body>
<canvas id="bg-canvas" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>
<div class="wrapper">

  <header>
    <div class="logo">
      <span class="logo-stroke"><span class="logo-letter" style="animation-delay:0s">S</span><span class="logo-letter" style="animation-delay:0.08s">T</span><span class="logo-letter" style="animation-delay:0.16s">R</span><span class="logo-letter" style="animation-delay:0.24s">O</span><span class="logo-letter" style="animation-delay:0.32s">K</span><span class="logo-letter" style="animation-delay:0.40s">E</span></span><span class="logo-test"><span class="logo-test-letter" style="animation-delay:0.54s">T</span><span class="logo-test-letter" style="animation-delay:0.62s">E</span><span class="logo-test-letter" style="animation-delay:0.70s">S</span><span class="logo-test-letter" style="animation-delay:0.78s">T</span></span>
    </div>
    <div class="header-right">
      <div class="tagline">Speed · Accuracy · Flow</div>
      <div class="hint-tag">Tab = Restart</div>
    </div>
  </header>

  <div class="card" id="main-card">

    <div class="stats-panel during-test" id="stats-panel">
      <div class="stat">
        <span class="stat-value" id="time-display">—</span>
        <span class="stat-label">Time Left</span>
      </div>
      <div class="stat" id="quote-cell">
        <span class="stat-quote" id="live-quote"></span>
      </div>
    </div>

    <div class="options-row">
      <span class="opt-label">Duration</span>
      <div class="duration-track" id="duration-track">
        <div class="duration-pill" id="duration-pill"></div>
        <button class="duration-option" data-time="15">15s</button>
        <button class="duration-option active" data-time="30">30s</button>
        <button class="duration-option" data-time="60">60s</button>
        <button class="duration-option" data-time="120">2 min</button>
      </div>
    </div>

    <div class="timer-bar-wrap" id="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar"></div>

function buildWordList(target) {
  // Shuffle sentences and pick unique ones — never repeat a sentence
  const shuffled = [...SENTENCE_POOL].sort(() => Math.random() - 0.5);
  const result = [];
  let sentenceIdx = 0;
  while (result.length < target) {
    const sentence = shuffled[sentenceIdx % shuffled.length];
    sentence.split(' ').forEach(w => { if (result.length < target) result.push(w); });
    sentenceIdx++;
    // Once we've used all sentences, reshuffle for the next pass
    if (sentenceIdx > 0 && sentenceIdx % shuffled.length === 0) {
      shuffled.sort(() => Math.random() - 0.5);
    }
  }
  return result;
}

function getQuoteTier(wpm, acc) {
  if (acc === 100 && wpm >= 60)  return 'perfect';
  if (wpm >= 85  && acc >= 85)   return 'veryFastGood';
  if (wpm >= 60  && acc >= 78)   return 'fastGood';
  if (wpm >= 55  && acc < 72)    return 'fastPoor';
  if (wpm >= 38  && acc >= 78)   return 'mediumGood';
  if (wpm >= 35  && acc >= 62)   return 'mediumOkay';
  if (wpm >= 30  && acc < 62)    return 'mediumPoor';
  if (wpm >= 12  && acc >= 65)   return 'slowOkay';
  return 'slowPoor';
}

    while (idx === lastLiveIdx) idx = Math.floor(Math.random() * pool.length);
  lastTier = tier; lastLiveIdx = idx;
  return pool[idx];
}

let typewriterTimer = null;

function typewriterWrite(el, text, onDone) {
  // Kill any in-progress typewriter
  if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }
  el.textContent = '';
  el.style.opacity = '1';
  el.style.transform = 'none';

  const chars = text.split('');
  let i = 0;
  // Simulate human typing: base 38ms, random burst/pause zones
  function typeNext() {
    if (i >= chars.length) { if (onDone) onDone(); return; }
    const ch = chars[i];
    el.textContent += ch;
    i++;
    // Random delay: spaces get short pause, occasionally burst fast, rarely micro-pause
    let delay;
    const r = Math.random();
    if (ch === ' ') {
      delay = 35 + Math.random() * 55;          // slight pause after space
    } else if (r < 0.06) {
      delay = 180 + Math.random() * 200;        // rare hesitation
    } else if (r < 0.18) {
      delay = 18 + Math.random() * 14;          // burst speed
    } else if (r < 0.32) {
      delay = 65 + Math.random() * 60;          // slower thoughtful
    } else {
      delay = 32 + Math.random() * 38;          // normal
    }
    typewriterTimer = setTimeout(typeNext, delay);
  }
  typeNext();
}

  if (currentCharIndex === 0) {

    left = r.left - cRect.left - 2;

    const r = prev.getBoundingClientRect();
    left = r.right - cRect.left;

    height = r.height * 0.78;
  }
  cursorBeam.style.display = 'block';
  cursorBeam.style.left   = left + 'px';

function animateCountUp(el, target, duration, suffix = '') {
  // Animate digits falling/rolling one by one
  const str = String(target) + suffix;
  el.textContent = '';
  el.style.display = 'inline-block';

  // Create a span per character, each drops in sequentially
  str.split('').forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'digit-drop';
    span.style.animationDelay = (i * 110) + 'ms';
    // For numeric digits, do a roll-up count effect
    if (/\d/.test(ch)) {
      const digitVal = parseInt(ch);
      // Start from a higher digit and tick down to real value
      span.dataset.target = ch;
      span.textContent = String((digitVal + 7) % 10); // start offset
      let ticks = 0;
      const totalTicks = 7 + digitVal; // land on correct digit
      const tickInterval = Math.max(30, (duration * 0.55) / totalTicks);
      setTimeout(() => {
        const iv = setInterval(() => {
          ticks++;
          const cur = parseInt(span.textContent);
          span.textContent = String((cur + 1) % 10);
          if (ticks >= totalTicks) {
            clearInterval(iv);
            span.textContent = ch;
          }
        }, tickInterval);
      }, i * 110);
    } else {
      span.textContent = ch;
    }
    el.appendChild(span);
  });
}

    setTimeout(() => wEl.classList.remove('shake'), 300);
  }
  currentWordIndex++; currentCharIndex = 0; hiddenInput.value = '';
  if (typed === words[currentWordIndex - 1]) {
    const prevEl = wordElements[currentWordIndex - 1];
    if (prevEl) {
      prevEl.classList.add('committed');
      setTimeout(() => prevEl.classList.remove('committed'), 420);
      spawnFloatParticle(prevEl);
    }
  }
  if (currentWordIndex >= words.length) { endTest(); return; }
  autoScrollToWord(currentWordIndex);
  updateLiveQuote(true); // force quote update on each word commit
}

hiddenInput.addEventListener('input', () => {
  if (finished) return;
  const inputVal = hiddenInput.value;
  const currentWord = words[currentWordIndex];

  if (inputVal.endsWith(' ')) {
    commitWord(inputVal);
  } else {
    currentCharIndex = inputVal.length;
    charElements[currentWordIndex]?.forEach((charEl, i) => {
      const wasWrong = charEl.classList.contains('wrong');
      charEl.classList.remove('correct', 'wrong');
      if (i < inputVal.length) {
        if (inputVal[i] === currentWord[i]) {
          charEl.classList.add('correct');
        } else {
          if (!wasWrong) void charEl.offsetWidth;
          charEl.classList.add('wrong');
        }
      }
    });
    updateLiveQuote();
  }
  moveCursor();
});

hiddenInput.addEventListener('keydown', e => {
  if (e.key === 'Backspace' && hiddenInput.value === '') e.preventDefault();
});


document.addEventListener('keydown', e => {
  // Tab = restart always
  if (e.key === 'Tab') { e.preventDefault(); generateWords(); resetTest(); return; }

  // If not started and key is a printable character, focus input and start
  if (!started && !finished && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
    hiddenInput.focus();
    startTyping();
    // Let the keypress fall through to the input naturally
  }
});

// Click on words area also focuses (but doesn't start until key)
document.getElementById('words-area').addEventListener('click', () => {
  if (!finished) { hiddenInput.focus(); }
});

hiddenInput.addEventListener('blur', () => {
  if (!started && !finished) mainCard.classList.remove('focused');
});

function resetTest() {
  clearInterval(timer);
  stopChallengeRotation();
  if (typewriterTimer) { clearTimeout(typewriterTimer); typewriterTimer = null; }
  started = finished = false;
  currentWordIndex = currentCharIndex = 0;
  totalTyped = totalErrors = correctChars = 0;
  lastQuoteUpdate = 0; lastTier = ''; lastLiveIdx = -1;
  timeLeft = selectedTime;

  timerBar.classList.remove('running');
  timerBarWrap.classList.remove('running');
  timerBar.style.transition = 'none';
  timerBar.style.transform  = 'scaleX(1)';
  hiddenInput.value = '';
  clickPrompt.classList.remove('hidden');
  cursorBeam.style.display = 'none';
  mainCard.classList.remove('focused');
  wordsDisplay.classList.remove('active-typing');
  document.getElementById('words-area').classList.remove('typing-glow');
  if (wordsInner) wordsInner.style.transform = 'translateY(0)';

  restoreStatsPanel();
  renderWords();
  startChallengeRotation();   // restart aggressive quote rotation
  requestAnimationFrame(moveCursor);
  requestAnimationFrame(() => positionPill(document.querySelector('.duration-option.active')));
}

// Button ripple
document.querySelectorAll('.btn, .duration-option').forEach(btn => {
  btn.style.position = 'relative';
  btn.style.overflow = 'hidden';
  btn.addEventListener('click', e => {
    const r = document.createElement('span');
    r.className = 'btn-ripple';
    const rect = btn.getBoundingClientRect();
    r.style.left = (e.clientX - rect.left) + 'px';
    r.style.top  = (e.clientY - rect.top)  + 'px';
    btn.appendChild(r);
    setTimeout(() => r.remove(), 650);
  });
});

// Float +word particle on correct word commit
function spawnFloatParticle(wordEl) {
  const r = wordEl.getBoundingClientRect();
  const ref = wordsInner || wordsDisplay;
  const cr = ref.getBoundingClientRect();
  const p = document.createElement('div');
  p.className = 'float-particle';
  p.textContent = '+';
  p.style.left = (r.left - cr.left + r.width / 2) + 'px';
  p.style.top  = (r.top  - cr.top)  + 'px';
  ref.appendChild(p);
  setTimeout(() => p.remove(), 800);
}

document.getElementById('restart-btn').addEventListener('click', (e) => {
  const btn = document.getElementById('restart-btn');
  btn.classList.remove('firing');
  void btn.offsetWidth;
  btn.classList.add('firing');
  setTimeout(() => btn.classList.remove('firing'), 580);

  // Spawn spark particles from button center
  const rect = btn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const sparkCount = 14;
  for (let i = 0; i < sparkCount; i++) {
    const spark = document.createElement('div');
    spark.className = 'rb-spark' + (i % 4 === 0 ? ' big' : '');
    const angle = (i / sparkCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
    const dist  = 28 + Math.random() * 38;
    spark.style.left = cx + 'px';
    spark.style.top  = cy + 'px';
    spark.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    spark.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    spark.style.animationDuration = (0.45 + Math.random() * 0.25) + 's';
    spark.style.animationDelay    = (Math.random() * 0.06) + 's';
    document.body.appendChild(spark);
    setTimeout(() => spark.remove(), 800);
  }

  generateWords(); resetTest();
});

// ── Duration pill track ──
function positionPill(activeBtn) {
  const pill  = document.getElementById('duration-pill');
  const track = document.getElementById('duration-track');
  if (!pill || !track || !activeBtn) return;
  const trackRect = track.getBoundingClientRect();
  const btnRect   = activeBtn.getBoundingClientRect();
  pill.style.left  = (btnRect.left - trackRect.left - 3) + 'px';
  pill.style.width = btnRect.width + 'px';
}

document.querySelectorAll('.duration-option').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.duration-option').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    positionPill(btn);
    selectedTime = parseInt(btn.dataset.time);
    generateWords(selectedTime >= 60 ? 180 : 100);
    resetTest();
  });
});

// Init pill position after layout
requestAnimationFrame(() => {
  positionPill(document.querySelector('.duration-option.active'));
});
window.addEventListener('resize', () => {
  positionPill(document.querySelector('.duration-option.active'));
});

window.addEventListener('resize', moveCursor);

generateWords();
resetTest();

// ─── BACKGROUND CANVAS ANIMATION ───────────────────────────────────────────
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // ── Floating orbs ──
  const ORB_COUNT = 6;
  const orbs = Array.from({ length: ORB_COUNT }, (_, i) => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 120 + Math.random() * 200,
    vx: (Math.random() - 0.5) * 0.35,
    vy: (Math.random() - 0.5) * 0.35,
    opacity: 0.03 + Math.random() * 0.04,
    phase: Math.random() * Math.PI * 2,
    speed: 0.0008 + Math.random() * 0.001,
  }));

  // ── Shooting particles ──
  const PARTICLE_COUNT = 55;
  const particles = Array.from({ length: PARTICLE_COUNT }, () => makeParticle());

  function makeParticle() {
    return {
      x: Math.random() * (W || window.innerWidth),
      y: Math.random() * (H || window.innerHeight),
      size: 0.6 + Math.random() * 1.6,
      vx: (Math.random() - 0.5) * 0.5,
      vy: -0.15 - Math.random() * 0.45,
      opacity: 0.08 + Math.random() * 0.22,
      life: Math.random(),         // 0–1, respawns at 0
      decay: 0.0015 + Math.random() * 0.003,
    };
  }

  // ── Pulse rings ──
  const rings = [];
  function spawnRing() {
    rings.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0,
      maxR: 180 + Math.random() * 220,
      opacity: 0.12,
      speed: 0.6 + Math.random() * 0.7,
    });
  }
  setInterval(spawnRing, 2200);
  spawnRing();

  // ── Constellation lines ──
  // Connect nearby particles with faint lines
  function drawConstellation() {
    const maxDist = 90;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < maxDist) {
          const alpha = (1 - d / maxDist) * 0.06;
          ctx.beginPath();
          ctx.strokeStyle = `rgba(245,197,66,${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
  }

  // ── Golden Sparkles / Sprinkles ──
  const SPARKLE_COUNT = 70;

  function makeStar() {
    return {
      x:       Math.random() * (W || window.innerWidth),
      y:       Math.random() * (H || window.innerHeight),
      size:    0.8 + Math.random() * 2.2,
      points:  Math.random() < 0.5 ? 4 : 6,   // 4-point diamond or 6-point star
      rot:     Math.random() * Math.PI * 2,
      rotSpeed:(Math.random() - 0.5) * 0.04,
      vx:      (Math.random() - 0.5) * 0.3,
      vy:      -0.08 - Math.random() * 0.25,
      opacity: 0,
      maxOp:   0.35 + Math.random() * 0.5,
      phase:   Math.random() * Math.PI * 2,
      twinkleSpeed: 0.025 + Math.random() * 0.04,
      born:    0,
      lifespan: 180 + Math.random() * 300,
      age:     Math.floor(Math.random() * 300), // stagger start
    };
  }

  const sparkles = Array.from({ length: SPARKLE_COUNT }, makeStar);

  function drawStar(cx, cy, pts, outer, inner, rot) {
    ctx.beginPath();
    for (let i = 0; i < pts * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const angle = rot + (i * Math.PI) / pts;
      i === 0 ? ctx.moveTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle))
              : ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    }
    ctx.closePath();
  }

  function drawSparkles() {
    sparkles.forEach((s, idx) => {
      s.age++;
      s.rot += s.rotSpeed;
      s.x   += s.vx;
      s.y   += s.vy;
      s.phase += s.twinkleSpeed;

      // fade in → twinkle → fade out
      const halfLife = s.lifespan * 0.5;
      if (s.age < halfLife * 0.3) {
        s.opacity = s.maxOp * (s.age / (halfLife * 0.3));
      } else if (s.age > s.lifespan * 0.7) {
        s.opacity = s.maxOp * (1 - (s.age - s.lifespan * 0.7) / (s.lifespan * 0.3));
      } else {
        s.opacity = s.maxOp * (0.6 + 0.4 * Math.sin(s.phase));
      }

      if (s.age > s.lifespan || s.y < -20) {
        sparkles[idx] = makeStar();
        sparkles[idx].y = H + 10;
        sparkles[idx].age = 0;
        return;
      }

      const a = Math.max(0, s.opacity);
      if (a < 0.005) return;

      // Draw sparkle star shape
      const outer = s.size;
      const inner = s.size * 0.38;
      drawStar(s.x, s.y, s.points, outer, inner, s.rot);

      // Gold gradient fill
      const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, outer * 1.5);
      grad.addColorStop(0,   `rgba(255,248,214,${a})`);
      grad.addColorStop(0.5, `rgba(245,197,66,${a * 0.8})`);
      grad.addColorStop(1,   `rgba(245,197,66,0)`);
      ctx.fillStyle = grad;
      ctx.fill();

      // Cross-hair shine lines on larger sparkles
      if (s.size > 1.6) {
        ctx.save();
        ctx.globalAlpha = a * 0.6;
        ctx.strokeStyle = `rgba(255,248,214,${a})`;
        ctx.lineWidth = 0.5;
        const arm = s.size * 2.5;
        ctx.beginPath();
        ctx.moveTo(s.x - arm, s.y); ctx.lineTo(s.x + arm, s.y);
        ctx.moveTo(s.x, s.y - arm); ctx.lineTo(s.x, s.y + arm);
        ctx.stroke();
        ctx.restore();
      }
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Orbs
    orbs.forEach(o => {
      o.phase += o.speed;
      const pulse = Math.sin(o.phase) * 0.012;
      o.x += o.vx;
      o.y += o.vy;
      if (o.x < -o.r) o.x = W + o.r;
      if (o.x > W + o.r) o.x = -o.r;
      if (o.y < -o.r) o.y = H + o.r;
      if (o.y > H + o.r) o.y = -o.r;
      const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      grad.addColorStop(0,   `rgba(245,197,66,${o.opacity + pulse})`);
      grad.addColorStop(0.5, `rgba(245,197,66,${(o.opacity + pulse) * 0.4})`);
      grad.addColorStop(1,   `rgba(245,197,66,0)`);
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    });

    // Constellation lines
    drawConstellation();

    // Particles
    particles.forEach((p, idx) => {
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0 || p.y < -10) {
        particles[idx] = makeParticle();
        particles[idx].y = H + 5;
        return;
      }
      const a = p.opacity * p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(245,197,66,${a})`;
      ctx.fill();
    });

    // Golden sparkles
    drawSparkles();

    // Pulse rings
    for (let i = rings.length - 1; i >= 0; i--) {
      const ring = rings[i];
      ring.r += ring.speed;
      ring.opacity = 0.12 * (1 - ring.r / ring.maxR);
      if (ring.r >= ring.maxR) { rings.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(245,197,66,${ring.opacity})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
</body>

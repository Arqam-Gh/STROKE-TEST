<body>
<canvas id="bg-canvas" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>
<div class="wrapper">

  <header>
    <div class="logo">
      <span class="logo-stroke"><span class="logo-letter" style="animation-delay:0s">S</span><span class="logo-letter" style="animation-delay:0.08s">T</span><span class="logo-letter" style="animation-delay:0.16s">R</span><span class="logo-letter" style="animation-delay:0.24s">O</span><span class="logo-letter" style="animation-delay:0.32s">K</span><span class="logo-letter" style="animation-delay:0.40s">E</span></span><span class="logo-test"><span class="logo-test-letter" style="animation-delay:0.54s">T</span><span class="logo-test-letter" style="animation-delay:0.62s">E</span><span class="logo-test-letter" style="animation-delay:0.70s">S</span><span class="logo-test-letter" style="animation-delay:0.78s">T</span></span>
    </div>
    <div class="header-right">
      <div class="tagline">Speed · Accuracy · Flow</div>
      <div class="mode-track" id="mode-track">
        <div class="mode-pill" id="mode-pill"></div>
        <button class="mode-option active" data-mode="normal">lowercase</button>
        <button class="mode-option" data-mode="caps">Gradual</button>
        <button class="mode-option" data-mode="punct">Punctuation+</button>
      </div>
      <div class="hint-tag" style="display:none">Tab = Restart</div>
    </div>
  </header>

  <div class="card" id="main-card">

    <div class="stats-panel during-test" id="stats-panel">
      <div class="stat">
        <span id="time-display" style="display:inline-flex;align-items:center;gap:6px;"></span>
        <span class="stat-label">Time Left</span>
      </div>
      <div class="stat" id="quote-cell">
        <div id="wpm-graph-container" class="wpm-graph-container">
          <canvas id="wpm-graph-canvas"></canvas>
        </div>
      </div>
    </div>

    <div class="options-row">
      <span class="opt-label">Duration</span>
      <div class="duration-track" id="duration-track">
        <div class="duration-pill" id="duration-pill"></div>
        <button class="duration-option" data-time="15">15s</button>
        <button class="duration-option active" data-time="30">30s</button>
        <button class="duration-option" data-time="60">60s</button>
        <button class="duration-option" data-time="120">2 min</button>
      </div>
    </div>

    <div class="timer-bar-wrap" id="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="words-area" id="words-area">
      <input type="text" id="hidden-input"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="words-display" id="words-display">
        <div id="cursor-beam"></div>
      </div>

    </div>

  </div>



  <div class="actions">
    <button class="btn btn-primary" id="restart-btn">
      <div class="rb-corner-tl"></div>
      <div class="rb-corner-br"></div>
      <div class="rb-shell">
        <div class="rb-charge"></div>
        <span class="rb-icon"><span class="rb-icon-inner">↺</span></span>
        <span class="rb-text">Restart</span>
      </div>
    </button>
    <span class="hint-small">Space = next word &nbsp;·&nbsp; Tab = restart</span>
    <span style="margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:0.78rem; font-weight:600; color:var(--muted2); letter-spacing:1px; text-transform:uppercase;">
      <a href="about.html" style="color:var(--muted2); text-decoration:none;">About Us</a>
    </span>
  </div>

</div>

<!-- Screen Saver Overlay (outside .wrapper so position:fixed is relative to viewport) -->
<div id="screensaver-overlay" class="screensaver-overlay">
  <div class="screensaver-logo">STROKE TEST</div>
  <div class="screensaver-content">
    <div id="screensaver-clock" class="screensaver-clock"></div>
    <div id="screensaver-date" class="screensaver-date"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
